name: Build VST3 (Windows x64)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:RUNNER_TEMP" -ExcludeVersion
          $root = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2"
          $includeDir = Join-Path $root "build\native\include"
          $library = Join-Path $root "build\native\x64\WebView2Loader.dll.lib"

          if (-not (Test-Path $includeDir) -or -not (Test-Path $library)) {
            throw "WebView2 SDK not found under $root"
          }

          "WEBVIEW2_INCLUDE_DIR=$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBVIEW2_LIBRARY=$library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DWebView2_include_dir="$env:WEBVIEW2_INCLUDE_DIR" `
            -DWebView2_library="$env:WEBVIEW2_LIBRARY"

      - name: Build VST3
        run: cmake --build build --config Release --target Mixing_Assistant_Pro_VST3 --parallel

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mixing_Assistant_Pro_VST3
          path: build/Mixing_Assistant_Pro_artefacts/Release/VST3/
          if-no-files-found: error
