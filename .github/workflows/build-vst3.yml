name: Build VST3 (Windows x64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build Solution
      run: cmake --build build --config Release --target Mixing_Assistant_Pro_VST3

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mixing_Assistant_Pro_VST3
        path: build/Mixing_Assistant_Pro_artefacts/Release/VST3/
