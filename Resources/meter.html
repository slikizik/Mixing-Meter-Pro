<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixing Assistant Pro</title>
    <style>
        body {
            background-color: #232323; /* Matches standard dark DAW background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #111111;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            text-align: center;
            width: 80%;
            max-width: 600px;
            border: 1px solid #444;
        }
        h1 { color: #00E676; margin-top: 0; letter-spacing: 1px; }
        .metric { display: flex; justify-content: space-between; margin: 15px 0; font-size: 1.2em; border-bottom: 1px solid #333; padding-bottom: 8px;}
        .val { font-weight: bold; font-family: monospace; color: #29B6F6; }
        .status { margin-top: 30px; font-size: 0.9em; color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mixing Assistant Pro</h1>
        <div class="metric"><span>Main LUFS:</span> <span class="val" id="mainLufs">-inf dB</span></div>
        <div class="metric"><span>Main Peak:</span> <span class="val" id="mainPeak">-inf dB</span></div>
        <div class="metric"><span>Sidechain LUFS:</span> <span class="val" id="scLufs">-inf dB</span></div>
        <div class="metric"><span>Stereo Width:</span> <span class="val" id="width">0.00</span></div>
        <div class="metric"><span>Sibilance Detected:</span> <span class="val" id="sib">False</span></div>
        <div class="status" id="status">Waiting for audio playback in Studio One...</div>
    </div>

    <script>
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data && data.type === 'meter-update') {
                document.getElementById('status').innerText = "Receiving active audio data...";
                document.getElementById('status').style.color = "#00E676";
                
                document.getElementById('mainLufs').innerText = data.mainLufs.toFixed(2) + " dB";
                document.getElementById('mainPeak').innerText = data.mainPeak.toFixed(2) + " dB";
                document.getElementById('scLufs').innerText = data.scLufs.toFixed(2) + " dB";
                document.getElementById('width').innerText = data.stereoWidth.toFixed(2);
                document.getElementById('sib').innerText = data.isSibilance;
            }
        });
    </script>
</body>
</html>
